spring.application.name=bookstore
# Local secrets live in .env (git-ignored); in CI/prod they come from environment variables
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
logging.level.org.springframework=DEBUG
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Frontend origins allowed to call the API (comma-separated); override with CORS_ALLOWED_ORIGINS on deploy
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5500}
spring.messages.basename=messages
spring.messages.encoding=UTF-8
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000
# Actuator: only /actuator/health is public (uptime monitors ping it); details such as the DB
# host stay hidden. Other endpoints (env, beans, ...) reveal configuration and stay closed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
