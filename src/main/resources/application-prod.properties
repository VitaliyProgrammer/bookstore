# Production profile: enabled on the server with SPRING_PROFILES_ACTIVE=prod.
# Every secret and address comes from environment variables, nothing is hard-coded here.

# Hosting platforms (Render) tell the app which port to listen on
server.port=${PORT:8080}

# Database URL includes TLS parameters, e.g. jdbc:mysql://<host>:4000/bookstore?sslMode=VERIFY_IDENTITY
spring.datasource.url=${DB_URL}
# Free database plans limit connections; 5 is plenty for a demo shop
spring.datasource.hikari.maximum-pool-size=5

# No SQL or bound parameters (user data) in production logs
spring.jpa.show-sql=false
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
