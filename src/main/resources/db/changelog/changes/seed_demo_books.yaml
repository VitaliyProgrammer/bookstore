        - insert:
            tableName: categories
            columns:
              - column: { name: name, value: "Поезія" }
              - column: { name: description, value: "Вірші й поеми українських поетів" }
        - insert:
            tableName: categories
            columns:
              - column: { name: name, value: "Фентезі" }
              - column: { name: description, value: "Чарівні світи, магія і великі пригоди" }
        - insert:
            tableName: categories
