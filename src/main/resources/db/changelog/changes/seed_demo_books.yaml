databaseChangeLog:
  - changeSet:
      id: seed-demo-genres-and-books
      author: vitaliy
      # Demo catalogue for the storefront: 10 genres x 6 books. Titles and authors are real;
      # ISBNs use the 979-99 prefix and are placeholders, not real editions.
      # Skipped in tests (contexts=test) so test data stays under the tests' control.
      context: "!test"
      changes:
        - insert:
            tableName: categories
            columns:
              - column: { name: name, value: "Українська класика" }
              - column: { name: description, value: "Твори, з яких починається українська література" }
