databaseChangeLog:
  - changeSet:
      id: demo-books-long-descriptions
      author: vitaliy
      # Longer, spoiler-free descriptions for the demo catalogue (seed_demo_books.yaml).
      # A new changeset instead of editing the seed: Liquibase refuses changed checksums of applied changesets.
      context: "!test"
      changes:
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "«Кобзар» — книжка, з якої для багатьох починається Україна. Уперше він вийшов 1840 року лише з вісьмома поезіями, а згодом став збіркою головних творів Тараса Шевченка: «Катерина», «Гайдамаки», «Сон», «Кавказ», «Заповіт». Тут є все: історія козацтва, біль покриток і кріпаків, гнів на імперію і ніжна лірика про рідний край. Мова Шевченка жива й музична, а його рядки досі цитують на площах і співають у піснях. Книжка, яку варто мати вдома, щоб перечитувати в різні роки життя." }
            where: "isbn = '9799900001019'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Драма-феєрія Лесі Українки, написана 1911 року за спогадами про волинські ліси її дитинства. Лісова мавка Мавка закохується в сільського хлопця Лукаша, який грає на сопілці так, що прокидається весь ліс. Але світ людей з його буденними клопотами, сварками й розрахунком виявляється зовсім не схожим на вільне життя лісу. Це історія про кохання, вірність собі й ціну, яку людина платить, коли зраджує свою мрію. Поетична мова, волинський фольклор і глибокий зміст роблять «Лісову пісню» одним із найкрасивіших творів української літератури." }
            where: "isbn = '9799900001026'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Повість Михайла Коцюбинського (1911), написана під враженням від подорожі на Гуцульщину. Іван і Марічка закохуються ще дітьми, хоча їхні родини давно ворогують. Гори, полонини, трембіти, гуцульські звичаї й вірування в мольфарів та нявок тут не тло, а жива частина історії. Це повість про кохання, сильніше за смерть, і про світ, де людина ще жила в одному ритмі з природою. За нею Сергій Параджанов зняв один із найвідоміших фільмів світового кіно." }
            where: "isbn = '9799900001033'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Історична повість Івана Франка (1883) про карпатське село Тухля в XIII столітті. Коли на Русь насувається монгольська орда, громада на чолі з мудрим старійшиною Захаром Беркутом мусить вирішити, скоритися чи стати до бою. Тим часом син Захара Максим закохується в Мирославу, доньку боярина Тугара Вовка, який ворогує з громадою. Повість про силу єдності, свободу й відповідальність кожного за спільну справу. Динамічний сюжет і яскраві характери роблять її однією з найкращих пригодницьких книжок української класики." }
            where: "isbn = '9799900001040'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Найсмішніша книжка української класики і водночас дуже точна. Іван Нечуй-Левицький (1879) розповідає про родину Кайдашів із села Семигори: старі батьки, два сини й дві невістки ніяк не можуть ужитися під одним дахом. Сварки за грушу, за горщик і за межу між городами переростають у справжню війну, у якій кожен вважає себе правим. Повість читається легко, а впізнавані характери й соковита народна мова роблять її актуальною і сьогодні. Чудовий вибір, щоб посміятися і водночас задуматися." }
            where: "isbn = '9799900001057'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Роман Ольги Кобилянської (1902), в основі якого реальна історія з буковинського села. Родина Федорчуків усе життя працює на своєму полі, і саме земля стає причиною драми між двома братами, Михайлом і Савою. Кобилянська показує, як любов до свого ґрунту може перетворитися на пристрасть, що руйнує людей і родину. Глибока психологічна проза, сильні жіночі образи й живі картини селянського життя Буковини. Роман, який недарма вважають вершиною української прози початку XX століття." }
            where: "isbn = '9799900001064'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Роман Софії Андрухович (2014) переносить у Станиславів, нинішній Івано-Франківськ, початку XX століття, часів Австро-Угорщини. Служниця Стефа з дитинства живе в родині лікаря поруч з Аделею, і їхні стосунки — дивна суміш любові, залежності й ревнощів. Коли в місто приїжджає ілюзіоніст, звичне життя двох жінок починає хитатися. Атмосферна, чуттєва проза з детально виписаним світом давнього міста. Книжка стала «Книгою року BBC», а 2020 року вийшла її екранізація «Віддана»." }
            where: "isbn = '9799900002016'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Роман Сергія Жадана (2017) про три зимові дні 2015 року на Донбасі. Учитель Паша, людина, що звикла ні в що не втручатися, мусить перетнути охоплене війною місто, щоб забрати племінника з інтернату. Дорога, яка в мирний час зайняла б годину, стає випробуванням, після якого вже неможливо залишатися осторонь. Сильний, стриманий і дуже людяний роман про відповідальність, страх і вибір. «Книга року BBC-2017»." }
            where: "isbn = '9799900002023'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Роман Марії Матіос (2004), що став однією з найвідоміших українських книжок XXI століття. У буковинському селі живе Даруся, яку всі вважають несповна розуму: вона не говорить, страждає від головного болю й рятується солодким. Чому вона така, розкривається поступово, через події кінця 1930-х і 1940-х, коли через село одна за одною прокочувалися різні влади. Драма про людину, зламану історією, і про ціну одного необережного слова. Шевченківська премія 2005 року." }
            where: "isbn = '9799900002030'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Масштабний роман Оксани Забужко (2009), сімейна сага, що охоплює понад шістдесят років історії України. Тележурналістка Дарина Гощинська готує фільм про загиблу подругу-художницю і крок за кроком відкриває таємниці кількох поколінь: від повстанців 1940-х до незалежної України. Це книжка про пам'ять, кохання й історію, яку намагалися стерти, але яка все одно визначає наше життя. Складна, глибока й дуже сильна проза для тих, хто любить великі романи." }
            where: "isbn = '9799900002047'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Дебютний роман лікаря Андрія Семянківа (2019), який знає медицину зсередини. Молодий лікар у звичайній лікарні щодня стикається з людським болем, бюрократією і браком ресурсів. Коли його втягують у темну схему, пов'язану з пересадкою органів, доводиться вирішувати, де межа між порятунком життя і злочином. Динамічний медичний трилер з гострими етичними питаннями й упізнаваними реаліями української лікарні. Роман став «Книгою року BBC-2019»." }
            where: "isbn = '9799900002054'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Перший роман Юрія Андруховича (1992), з якого почалася нова українська проза. Четверо поетів приїжджають у карпатське містечко Чортопіль на «Свято Воскресаючого Духу», грандіозний карнавал. Те, що починається як веселе богемне дійство, поступово перетворюється на химерну фантасмагорію, де вже незрозуміло, де гра, а де справжній переворот. Іронічна, яскрава й провокативна книжка про свободу і пошук себе в часи великих змін." }
            where: "isbn = '9799900002061'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Історичний роман у віршах Ліни Костенко, відзначений Шевченківською премією. Полтава, середина XVII століття: дівчину-співачку Марусю Чурай судять за отруєння коханого Гриця, який зрадив її заради багатої нареченої. Суд над однією дівчиною перетворюється на розмову про любов, зраду, честь і долю народу, чиї пісні вона склала. Мова Костенко точна й афористична, кожен рядок хочеться цитувати. Книжка, яку перечитують ціле життя." }
            where: "isbn = '9799900003013'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Збірка Василя Стуса, створена в ув'язненні у 1970-х роках і названа за образом пергаменту, на якому стерте пишуть заново. Ці вірші народжувалися в таборах і на засланні, частину текстів у поета конфіскували. Попри все, це не поезія відчаю, а поезія незламності: про свободу духу, гідність, любов до рідних і вірність собі. Складна й глибока лірика, яка вимагає уважного читання і щедро за нього віддячує." }
            where: "isbn = '9799900003020'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Перша збірка Павла Тичини (1918), одна з вершин українського модернізму. Тичина «чує» світ як музику: у його віршах звучать дзвони, сопілки, шелест трав і саме сонячне світло. Тут є і світла лірика про кохання та природу, як знамените «Ви знаєте, як липа шелестить…», і тривожні передчуття революційної доби. Збірка, після якої стає зрозуміло, чому Тичину вважають одним із найоригінальніших поетів XX століття." }
            where: "isbn = '9799900003037'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Збірка Богдана-Ігоря Антонича (1938), що вийшла вже після смерті поета, якому було лише 27 років. Антонич бачив світ як живе, співоче творіння: дерева, звірі, люди й зорі в його віршах пов'язані одним круговоротом життя. Яскраві метафори, лемківські мотиви й радісне, майже язичницьке відчуття весни роблять цю поезію неповторною. Книжка для тих, хто хоче відкрити для себе одного з найсвітліших українських поетів." }
            where: "isbn = '9799900003044'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Єдина прижиттєва збірка Василя Симоненка (1962), поета-шістдесятника, який прожив лише 28 років. У ній і ніжна лірика, і пристрасні вірші про любов до України, правду та людську гідність. Симоненко писав просто й чесно, тому його поезію легко полюбити з першого вірша. Це йому належать рядки, які знає кожен: «Можна все на світі вибирати, сину, вибрати не можна тільки Батьківщину». Збірка, яка й сьогодні звучить сміливо й сучасно." }
            where: "isbn = '9799900003051'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Перша збірка Лесі Українки (1893), з якої почалася велика поетеса. Тут цикли «Сім струн», «Сльози-перли», «Подорож до моря» і знаменитий вірш «Contra spem spero!» («Без надії сподіваюсь»). Ліричні, громадянські й пейзажні поезії юної авторки вражають силою духу й музичністю. Прекрасний вибір, щоб познайомитися з Лесею Українкою не лише як з авторкою «Лісової пісні»." }
            where: "isbn = '9799900003068'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Казкова повість Дж. Р. Р. Толкіна (1937), з якої почалося Середзем'я. Гобіт Більбо Торбин любить затишок, чай і спокій, аж поки чарівник Ґендальф і тринадцять гномів не втягують його в похід за скарбом, який стереже дракон Смауг. Тролі, ельфи, гобліни, загадки в темряві й чарівний перстень — пригода, що змінить і Більбо, і весь його світ. Ідеальна книжка для читання в будь-якому віці." }
            where: "isbn = '9799900004010'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Перша книга саги «Пісня льоду й полум'я» Джорджа Р. Р. Мартіна (1996). У Семи Королівствах Вестеросу великі доми — Старки, Ланістери, Таргарієни — борються за Залізний трон, а з-за Стіни на півночі насувається давня загроза. Інтриги, зради, війни й несподівані повороти, де жоден герой не застрахований від загибелі. Основа культового серіалу HBO. Затягує з перших сторінок." }
            where: "isbn = '9799900004027'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Збірка оповідань Анджея Сапковського (1993), з якої починається історія Ґеральта з Рівії, відьмака, що за плату полює на чудовиськ. Він зустрічає стриг, джинів і перевертнів, але найнебезпечнішими часто виявляються люди. Сапковський переосмислює відомі казки, робить їх дорослими, іронічними й неоднозначними. Саме тут Ґеральт знайомиться з бардом Любистком і чарівницею Єнніфер. Основа відомої серії відеоігор і серіалу Netflix." }
            where: "isbn = '9799900004034'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Перша книга знаменитої серії Дж. К. Ролінґ (1997). Одинадцятирічний Гаррі живе в комірчині під сходами в тітки й дядька, аж поки не дізнається, що він чарівник і запрошений до Гоґвортсу, школи чарів і чаклунства. Нові друзі Рон і Герміона, квідич, таємні коридори й загадка, яку охороняє триголовий пес. Книжка, що закохала в читання мільйони дітей і дорослих. Український переклад Віктора Морозова." }
            where: "isbn = '9799900004041'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Перша книга «Хроніки Вбивці Короля» Патріка Ротфусса (2007). Скромний корчмар у глухому селі насправді Квоут, легендарний чарівник, музикант і злодій, про якого складають пісні. Протягом трьох днів він розповідає справжню історію свого життя: від дитинства в мандрівній трупі до навчання в Університеті, де магія — це точна наука. Неймовірно красива мова і герой, якого неможливо забути." }
            where: "isbn = '9799900004058'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Роман Ніла Ґеймана (2001), відзначений преміями «Г'юго» та «Неб'юла». Тінь щойно вийшов із в'язниці й дізнався про смерть дружини, коли загадковий містер Середа пропонує йому роботу. Так Тінь опиняється у війні між старими богами, яких привезли до Америки іммігранти, і новими богами — телебачення, інтернету й технологій. Темна, дотепна й глибока книжка про віру, пам'ять і те, у що ми вкладаємо свою увагу." }
            where: "isbn = '9799900004065'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Культовий роман Френка Герберта (1965), одна з найвпливовіших книжок в історії наукової фантастики. На пустельній планеті Арракіс видобувають спецію, найцінніший ресурс у Всесвіті. Юний Пол Атрід разом із родиною прибуває правити планетою, але потрапляє в смертельну гру великих домів, імператора і загадкових фрименів. Політика, екологія, релігія й пророцтва в одному епічному сюжеті. Премії «Г'юго» і «Неб'юла», основа фільмів Дені Вільнева." }
            where: "isbn = '9799900005017'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Перший роман знаменитої трилогії Айзека Азімова. Математик Гарі Селдон за допомогою психоісторії передбачає неминуче падіння Галактичної імперії і тридцять тисяч років темряви після нього. Щоб скоротити цей час до тисячі років, він створює Фундацію, спільноту вчених на краю Галактики. Розумна й захоплива фантастика, де головна зброя — не бластери, а знання і передбачення. Основа серіалу Apple TV+." }
            where: "isbn = '9799900005024'"
        - update:
            tableName: books
            columns:
              - column: { name: description, value: "Антиутопія Рея Бредбері (1953) про світ, де пожежники не гасять, а спалюють книжки, бо читання вважається небезпечним. Пожежник Гай Монтеґ щодня сумлінно виконує свою роботу, аж поки зустріч із дивною дівчиною Кларисою не змушує його вперше спитати себе, чи щасливий він. Коротка, але дуже сильна книжка про цензуру, споживання і цінність самостійної думки. Сьогодні вона звучить актуальніше, ніж будь-коли." }
